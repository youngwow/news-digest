# news-digest pipeline configuration

llm:
  active: cloud                 # name from `providers` below; flip to switch backends
  classify_concurrency: 4       # parallel chunk classification workers (any provider)
  cache_retention_days: 7       # prune data/chunk_cache/ entries older than this
  failure_tolerance: 0.34       # ok if <= this ratio of chunks fail (0.0 = strict, 1.0 = ignore)
  bad_json_retry: true          # on unparseable LLM output, retry chunk with stricter prompt
  providers:
    - name: cloud
      base_url: "https://ollama.com/v1"
      model: "deepseek-v4-flash:cloud"
      api_key_env: "OLLAMA_API_KEY"   # null/missing → no Authorization header sent
      temperature: 0.3
      max_tokens: 16384
      timeout: 180
      max_retries: 3
    - name: local
      base_url: "http://localhost:11434/v1"
      model: "gemma4:e4b"             # whichever model `ollama pull`ed locally
      api_key_env: null
      temperature: 0.3
      max_tokens: 16384
      timeout: 300
      max_retries: 2

scraper:
  date_window_hours: 8
  request_timeout: 20  # seconds per HTTP request
  max_redirects: 5
  user_agent: "Mozilla/5.0 (compatible; NewsDigestBot/1.0; +https://github.com/hermes)"
  fetch_bodies: false               # off by default; flip to true for richer LLM context
  body_max_chars: 3000              # truncate fetched body to this length
  body_timeout: 10                  # seconds per body GET
  body_concurrency: 8               # parallel fetchers
  body_cache_retention_days: 14     # prune data/body_cache/ entries older than this

pipeline:
  chunk_size: 15             # articles per classification chunk
  training_log: true         # append LLM-labeled rows to data/training/dataset.jsonl each run

telegram:
  message_limit: 4096
  enabled: false             # true → run.sh delivers the digest via Bot API
                             # (needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env)
  alerts: false              # true → pipeline_check.sh pushes ALERT output to the same chat
                             # (independent of `enabled`; duplicate alerts are suppressed)

health:
  min_sources_ok: 3
  expected_sources: 10
  default_max_age_minutes: 360  # 6 hours

dedup:
  overlap_threshold: 0.50          # merge if shared-word ratio exceeds this
  shared_words_min: 5              # merge if at least this many significant words match
  containment_min_len: 15          # min title length to trigger substring containment check
  cross_run_enabled: true          # filter URLs already delivered in a recent digest
  cross_run_retention_days: 1      # remember delivered URLs for this many days
  semantic_enabled: true           # embedding-based dedup pass after word overlap
                                   # (needs `pip install -e ".[ml]"`; falls back gracefully)
  semantic_threshold: 0.70         # cosine similarity ≥ this merges two stories
                                   # (calibrated on real digests; valid for both backends below.
                                   #  NB: paraphrase-* models (MiniLM/mpnet) conflate same-topic with
                                   #  same-event on news titles — keep bitext-style models here)
  semantic_model: "sentence-transformers/LaBSE"               # primary backend (torch; auto-selects MPS/CUDA)
  semantic_model_static: "minishlab/potion-multilingual-128M" # fallback backend (model2vec, no torch)

archive:
  retention_days: 30               # prune data/digests/ snapshots older than this

threads:
  enabled: true                    # mark stories that develop a recently-delivered story (🔄)
  lookback_days: 3                 # compare against archive snapshots from this window
  similarity_threshold: 0.60       # cosine ≥ this links a story to an archived one
                                   # (calibrated on real follow-ups: true threads ≥ 0.66, noise ≤ 0.53)

heuristics:
  multi_source_max_boost: 2        # cap on +importance from sources covering same story
  recency_window_hours: 2          # articles published within this window get a boost
  recency_boost: 1                 # importance added for recent stories
  source_weight_max_boost: 1       # cap on +importance from high-trust sources

categories:
  order:
    - политика
    - мир
    - экономика
    - технологии
    - спорт
    - наука
    - культура
    - прочее
  emoji:
    политика:  "🏛️"
    экономика: "💰"
    технологии: "🤖"
    мир:       "🌍"
    спорт:     "⚽"
    наука:     "🔬"
    культура:  "🎭"
    прочее:    "📌"
  labels:
    политика:  "🏛️ Политика"
    экономика: "💰 Экономика"
    технологии: "🤖 Технологии"
    мир:       "🌍 Мир"
    спорт:     "⚽ Спорт"
    наука:     "🔬 Наука"
    культура:  "🎭 Культура"
    прочее:    "📌 Прочее"
