name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install Python (.python-version) and dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      # The gold-set test needs the embedding model in the Hugging Face cache and
      # skips itself without it; everything else runs offline.
      - name: Test
        run: uv run pytest -q

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (type-check + bundle)
        run: npm run build
